[package]
name = "wolfram"
version = "0.1.4"
edition = "2024"
description = "Proactive memory compression and process hibernation daemon for Linux"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", features = ["process", "fs", "user", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
